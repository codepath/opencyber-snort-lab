# Publish the lab image to GitHub Container Registry (GHCR).
#
# Why this exists: Snort is compiled from source, and cross-building the "other"
# architecture under QEMU emulation crashes gcc. This workflow sidesteps that by
# building each architecture on its OWN NATIVE runner (amd64 on ubuntu-latest,
# arm64 on ubuntu-24.04-arm) — no emulation anywhere — then stitching the two into
# one multi-arch tag. It runs the same docker/Dockerfile you build locally, so the
# Dockerfile stays the single source of truth; there's nothing here to keep in sync.
#
# How to use it: Actions tab → "Publish to GHCR" → "Run workflow". That's it.
# (Native arm64 runners are free on PUBLIC repos, so this is ready to go once the
# repo is public.)

name: Publish to GHCR

on:
  workflow_dispatch:        # manual "Run workflow" button — no automatic triggers

env:
  IMAGE: ghcr.io/codepath/opencyber-snort-lab

permissions:
  contents: read
  packages: write           # lets the built-in GITHUB_TOKEN push to GHCR — no PAT needed

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest        # native amd64
          - arch: arm64
            runner: ubuntu-24.04-arm      # native arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.arch }}   # per-arch tag, merged below

  manifest:
    name: merge into :latest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine the per-arch images into one multi-arch :latest
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:amd64 \
            ${{ env.IMAGE }}:arm64
